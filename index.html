<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>سياسة الخصوصية - جواب تِك</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>

/* ========= ROOT ========= */
:root {
    --primary: #6366f1;
    --secondary: #8b5cf6;
    --text-dark: #111827;
    --text-light: #f9fafb;
}

/* ========= BODY ========= */
body {
    font-family: 'Cairo', sans-serif;
    margin: 0;
    padding: 20px;
    transition: 0.4s;
}

/* Dark Mode */
body.dark {
    background: radial-gradient(circle at top, #1e293b, #020617);
    color: var(--text-light);
}

/* Light Mode */
body.light {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: var(--text-dark);
}

/* ========= CONTAINER ========= */
.container {
    max-width: 900px;
    margin: auto;
    padding: 40px;
    border-radius: 25px;
    backdrop-filter: blur(20px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}

body.dark .container {
    background: rgba(255,255,255,0.05);
}

body.light .container {
    background: white;
}

/* ========= HEADER ========= */
.header {
    text-align: center;
    position: relative;
}

/* Glow */
.header::before {
    content: "";
    position: absolute;
    width: 350px;
    height: 350px;
    background: radial-gradient(circle, rgba(99,102,241,0.35), transparent 70%);
    filter: blur(60px);
    top: -100px;
    left: 50%;
    transform: translateX(-50%);
}

/* LOGO */
.logo-box {
    width: 120px;
    height: 120px;
    margin: auto;
    border-radius: 30px;
    background: linear-gradient(135deg,#6366f1,#8b5cf6);
    display:flex;
    align-items:center;
    justify-content:center;
    animation: float 3s infinite ease-in-out;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
}

.logo-box img {
    width: 80%;
    height: 80%;
    object-fit: contain;
}

/* Float Animation */
@keyframes float {
    0%{transform:translateY(0)}
    50%{transform:translateY(-10px)}
    100%{transform:translateY(0)}
}

/* ========= TEXT ========= */
h1 {
    font-size: 2em;
    margin: 15px 0;
    font-weight: 700;
}

body.dark h1 { color: #e0e7ff; }
body.light h1 { color: #1e293b; }

.app-name {
    font-size: 1.1em;
    opacity: 0.8;
}

/* Updated Badge */
.last-updated {
    display:inline-block;
    margin-top:10px;
    padding:6px 14px;
    border-radius:20px;
    font-size:0.9em;
}

body.dark .last-updated {
    background: rgba(255,255,255,0.1);
}

body.light .last-updated {
    background: #eef2ff;
}

/* ========= SECTIONS ========= */
h2 {
    margin-top:30px;
    border-right:4px solid var(--primary);
    padding-right:10px;
}

p,li {
    line-height:1.8;
}

/* Cards */
ul li {
    background: rgba(255,255,255,0.06);
    padding:12px;
    border-radius:10px;
    margin-bottom:8px;
}

/* Contact */
.contact-box {
    padding:20px;
    border-radius:15px;
    background: rgba(99,102,241,0.1);
}

/* English */
.english-section {
    direction:ltr;
    margin-top:40px;
    border-top:1px solid rgba(255,255,255,0.2);
    padding-top:20px;
}

/* Footer */
.footer {
    text-align:center;
    margin-top:30px;
    opacity:0.7;
}

/* ========= TOGGLE ========= */
.toggle {
    position: fixed;
    top: 20px;
    left: 20px;
    background: #6366f1;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 10px;
    cursor: pointer;
}

</style>
</head>

<body class="dark">

<button class="toggle" onclick="toggleMode()">🌙 / ☀️</button>

<div class="container">

<div class="header">

<div class="logo-box">
<img src="https://raw.githubusercontent.com/ibaaya/jawab-tik-privacy/main/logo.png">
</div>

<h1>سياسة الخصوصية | Privacy Policy</h1>

<p class="app-name">تطبيق جواب تِك - Jawab Tik</p>

<div class="last-updated">آخر تحديث: 28 فبراير 2026</div>

</div>

<section>
<h2>1. مقدمة</h2>
<p>نحترم خصوصيتك ونحمي بياناتك.</p>

<h2>2. البيانات</h2>
<ul>
<li>الاسم والبريد</li>
<li>النقاط والإحصائيات</li>
</ul>

<h2>3. الاستخدام</h2>
<ul>
<li>تحسين التجربة</li>
</ul>

<div class="contact-box">
<p>engiba@gmail.com</p>
</div>
</section>

<section class="english-section">
<h2>Privacy Policy</h2>
<p>This app is provided for free.</p>
</section>

<div class="footer">© 2026 Jawab Tik</div>

</div>

<script>
function toggleMode(){
    document.body.classList.toggle("dark");
    document.body.classList.toggle("light");
}
</script>

</body>
</html>
